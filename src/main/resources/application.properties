spring.application.name=wise-compare-service
server.servlet.context-path=/api
server.port=8082

spring.graphql.http.path=/graphql
spring.graphql.schema.locations=classpath:/
spring.graphql.schema.file-extensions=.graphqls
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Actuator properties
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.metrics.enable.http.client=true

#Circuit breaker properties
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.register-health-indicator=true
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.COMPARE_SERVICE.sliding-window-type=count-based

# Retry properties
resilience4j.retry.instances.COMPARE_SERVICE.max-attempts=5
resilience4j.retry.instances.COMPARE_SERVICE.wait-duration=2s
# resilience4j.retry.instances.COMPARE_SERVICE.register-health-indicator=true

# Rate Limiter properties
resilience4j.ratelimiter.instances.COMPARE_SERVICE.register-health-indicator=false
resilience4j.ratelimiter.instances.COMPARE_SERVICE.limit-for-period=10
resilience4j.ratelimiter.instances.COMPARE_SERVICE.limit-refresh-period=10s
resilience4j.ratelimiter.instances.COMPARE_SERVICE.timeout-duration=3s